<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrabNest – Video & Song Downloader</title>
<style>
:root{--bg:#0a0620;--bg2:#150b3a;--v:#7c5cff;--p:#ff5c8a;--c:#35e0ff;--t:#f4f1ff;--m:#a79fd0;--g:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#2a1470 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#4a0f55 0,transparent 55%),var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;opacity:.45;pointer-events:none;}
.o1{width:300px;height:300px;background:radial-gradient(circle,rgba(124,92,255,.55),transparent 70%);top:8%;left:-80px}
.o2{width:260px;height:260px;background:radial-gradient(circle,rgba(255,92,138,.45),transparent 70%);bottom:10%;right:-70px;animation-delay:-4s}
@keyframes fl{50%{transform:translateY(-40px) scale(1.1)}}
.wrap{position:relative;max-width:520px;margin:0 auto;padding:14px 16px 90px}
.ad{border:1px dashed var(--gb);background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--m);font-size:12px;letter-spacing:.3px;min-height:60px;margin:10px 0;text-align:center;padding:8px}
.ad b{color:var(--t)}
header{text-align:center;padding:18px 0 6px;perspective:700px}
.logo{display:inline-flex;align-items:center;gap:12px}
.cube{width:46px;height:46px;position:relative;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube i{position:absolute;inset:0;border-radius:10px;border:1.5px solid rgba(255,255,255,.55);background:linear-gradient(135deg,rgba(124,92,255,.75),rgba(255,92,138,.6));box-shadow:inset 0 0 14px rgba(255,255,255,.25)}
.cube i:nth-child(1){transform:translateZ(23px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(23px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(23px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(23px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(23px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(23px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;background:linear-gradient(90deg,#fff,var(--c) 55%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--m);font-size:14px;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;perspective:900px}
.card{position:relative;aspect-ratio:1/1.05;border-radius:24px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:1px solid var(--gb);background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 18px 30px -12px var(--s),inset 0 1px 0 rgba(255,255,255,.4);transform-style:preserve-3d;transition:transform .18s ease-out,box-shadow .2s;overflow:hidden;color:#fff;text-align:left;font:inherit}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.35),transparent 55%)}
.card:active{transform:scale(.96)}
.ic{width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;transform:translateZ(40px);box-shadow:0 10px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5);}
.ic svg{width:30px;height:30px;fill:#fff}
.card h3{font-size:17px;font-weight:800;line-height:1.15;transform:translateZ(30px);position:relative}
.card p{font-size:12px;opacity:.85;margin-top:3px;font-weight:500}
.c-ig{--a:#ff5c8a;--b:#8a3cff;--s:rgba(255,92,138,.55)}
.c-yv{--a:#ff4d4d;--b:#b4162e;--s:rgba(255,77,77,.5)}
.c-ys{--a:#35e0ff;--b:#3d5bff;--s:rgba(53,224,255,.45)}
.c-fb{--a:#4d8bff;--b:#1a2f9c;--s:rgba(77,139,255,.5)}
.trust{display:flex;justify-content:center;gap:16px;margin-top:20px;color:var(--m);font-size:12px;flex-wrap:wrap}
.trust span:before{content:"✓ ";color:var(--c)}
.page{display:none}.page.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(14px) rotateX(8deg)}}
.back{background:var(--g);border:1px solid var(--gb);color:var(--t);padding:9px 16px;border-radius:99px;font:600 13px inherit;font-family:inherit;cursor:pointer;margin-top:8px}
.panel{margin-top:16px;border-radius:26px;padding:20px;background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid var(--gb);box-shadow:0 30px 50px -25px #000,inset 0 1px 0 rgba(255,255,255,.25);}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ph .ic{transform:none;background:linear-gradient(145deg,var(--a),var(--b));width:52px;height:52px}
.ph h2{font-size:21px;letter-spacing:-.4px}.ph p{color:var(--m);font-size:13px;margin-top:2px}
.inp{display:flex;gap:8px;background:rgba(0,0,0,.35);border:1.5px solid var(--gb);border-radius:18px;padding:6px;transition:border .2s,box-shadow .2s}
.inp:focus-within{border-color:var(--v);box-shadow:0 0 0 4px rgba(124,92,255,.25)}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--t);font:500 15px inherit;font-family:inherit;padding:10px 10px}
.btn{border:0;border-radius:14px;padding:12px 18px;font:700 14px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--v),var(--p));box-shadow:0 10px 20px -8px var(--p),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s}
.btn:active{transform:translateY(2px) scale(.98)}
.btn.sec{background:var(--g);box-shadow:none;border:1px solid var(--gb)}
.btn.big{width:100%;padding:16px;font-size:16px;margin-top:16px;border-radius:18px}
.err{color:#ff8fa8;font-size:13px;margin-top:10px;min-height:18px}
.res{display:none;margin-top:12px}.res.on{display:block;animation:in .4s}
.vid{display:flex;gap:14px;align-items:center}
.thumb{width:110px;height:76px;border-radius:16px;flex:none;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;box-shadow:0 14px 24px -10px var(--s,#000);position:relative;transform:perspective(400px) rotateY(-12deg)}
.thumb:after{content:"";border-left:18px solid #fff;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.vid b{font-size:15px;line-height:1.3;display:block}.vid small{color:var(--m);font-size:12px}
.lbl{font-size:13px;color:var(--m);margin:16px 0 8px;font-weight:600}
.q{display:flex;flex-wrap:wrap;gap:8px}
.q button{background:var(--g);border:1.5px solid var(--gb);color:var(--t);border-radius:14px;padding:10px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:.2s}
.q button small{display:block;color:var(--m);font-weight:500;font-size:11px;margin-top:1px}
.q button.sel{background:linear-gradient(135deg,var(--v),var(--p));border-color:transparent;transform:translateY(-2px);box-shadow:0 10px 18px -8px var(--p)}
.q button.sel small{color:#ffe}
.prog{display:none;margin-top:16px}.prog.on{display:block}
.bar{height:12px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--v),var(--p));border-radius:9px;transition:width .2s}
.pt{display:flex;justify-content:space-between;font-size:12px;color:var(--m);margin-top:6px}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,2,20,.85);display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.pop{width:100%;max-width:360px;background:linear-gradient(160deg,#241060,#120a34);border:1px solid var(--gb);border-radius:26px;padding:18px;text-align:center;animation:in .3s}
.pop .ad{min-height:200px;margin:8px 0 14px}
.foot{text-align:center;color:var(--m);font-size:11px;margin-top:10px;opacity:.8}
.sticky{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 6px);width:calc(100% - 20px);max-width:500px;z-index:20;margin:0;background:rgba(10,6,32,.94);min-height:54px}
@media(prefers-color-scheme:light){:root{}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.adbox{position:relative;width:100%;margin:10px auto;overflow:hidden;border-radius:10px}
.sticky.adbox{margin:0}
.native{margin:12px 0;min-height:10px;overflow:hidden}
.rail{display:none}
@media(min-width:1100px){.rail{display:block;position:fixed;top:90px;width:160px;z-index:5}.rail.l{left:calc(50% - 440px)}.rail.r{right:calc(50% - 440px)}.rail .adbox{margin:0}}
button,.card,input,.q button{touch-action:manipulation}
#skip{display:none}
</style>
</head>
<body>

<!-- TOP AD (dummy) – yahan apna ad code daalna: id="adTop" -->

<!-- HOME -->
<section class="page on" id="home">
  <header>

<div class="ov" id="ov"><div class="pop">
  <div class="lbl" style="margin:0">Ad · <span id="cd">5</span>s mein download shuru</div>
  <div class="adbox" id="adInter" data-key="ca3f563de5c4edefb8ac87a77fbf8273" data-w="300" data-h="250"></div>

</div></div>

<script>
/* ===== SETTINGS =====
   API_BASE: apne Render backend ka URL (aakhir mein / nahi). RapidAPI key yahan KABHI mat daalna. */
const API_BASE = "https://YOUR-BACKEND.onrender.com";
const AD_SECONDS = 3;

const T = {
  ig:{n:"Instagram Reel",h:"Reel ka link paste karo",ph:"https://instagram.com/reel/...",dom:["instagram.com"],q:[["1080p","MP4"],["720p","MP4"],["480p","MP4"]],cls:"c-ig",kind:"video"},
  yv:{n:"YouTube Video",h:"Video ka link paste karo",ph:"https://youtube.com/watch?v=...",dom:["youtube.com","youtu.be"],q:[["1080p","MP4"],["720p","MP4"],["480p","MP4"],["360p","MP4"]],cls:"c-yv",kind:"video"},
  ys:{n:"YouTube Song",h:"Song ka link paste karo",ph:"https://youtube.com/watch?v=...",dom:["youtube.com","youtu.be"],q:[["320 kbps","MP3"],["128 kbps","MP3"],["Best","M4A"]],cls:"c-ys",kind:"audio"},
  fb:{n:"Facebook Video",h:"Video ka link paste karo",ph:"https://facebook.com/watch/...",dom:["facebook.com","fb.watch"],q:[["HD","MP4"],["SD","MP4"]],cls:"c-fb",kind:"video"}
};
const $=id=>document.getElementById(id);
let cur=null,sel=0,busy=false,Q=[];

/* 3D tilt on cards */
document.querySelectorAll(".card").forEach(c=>{
  c.addEventListener("pointermove",e=>{
    if(e.pointerType==="touch")return;
    const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.style.transform=`rotateY(${(x-.5)*18}deg) rotateX(${(.5-y)*18}deg) translateZ(8px)`;
    c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");
  });
  c.addEventListener("pointerleave",()=>c.style.transform="");
  c.addEventListener("click",()=>openTool(c.dataset.k,c));
});

function show(id){document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id===id));window.scrollTo({top:0})}
function openTool(k,card){
  cur=k;const t=T[k];
  $("panel").className="panel "+t.cls;
  $("pic").innerHTML=card.querySelector(".ic").innerHTML;
  $("ptitle").textContent=t.n;$("phint").textContent=t.h;
  $("url").placeholder=t.ph;$("url").value="";$("err").textContent="";
  $("res").classList.remove("on");$("prog").classList.remove("on");
  $("fetchBtn").style.display="";$("fetchBtn").textContent="Link check karo";
  $("thumb").className="thumb "+t.cls;
  show("tool");
}
$("back").onclick=()=>{busy=false;show("home")};

$("paste").onclick=async()=>{
  try{$("url").value=await navigator.clipboard.readText();$("err").textContent="";check()}
  catch(e){$("err").textContent="Paste allow nahi hua — link long-press karke paste karo.";$("url").focus()}
};

function valid(u){
  try{const h=new URL(u).hostname.replace(/^(www|m)\./,"");return T[cur].dom.some(d=>h===d||h.endsWith("."+d))}catch(e){return false}
}

async function getInfo(u){
  if(API_BASE){
    const r=await fetch(API_BASE+"/info?url="+encodeURIComponent(u)+"&kind="+T[cur].kind);
    let d={};try{d=await r.json()}catch(e){}
    if(!r.ok)throw new Error(d.error||"Is link se video nahi mila. Link public hona chahiye.");
    return d;
  }
  await new Promise(r=>setTimeout(r,1200));
  const t=T[cur];
  return {title:t.kind==="audio"?"Demo Song – Official Audio":"Demo "+t.n+" – Sample Title",meta:t.kind==="audio"?"3:42 · Audio":"0:45 · Video",qualities:t.q};
}

const check=async()=>{
  if($("fetchBtn").disabled)return;
  const u=$("url").value.trim();
  if(!u){$("err").textContent="Pehle link paste karo.";return}
  if(!valid(u)){$("err").textContent="Ye link "+T[cur].n+" ka nahi lag raha. Check karke dobara try karo.";return}
  $("err").textContent="";
  const b=$("fetchBtn");b.innerHTML='<span class="spin"></span>Check ho raha hai…';b.disabled=true;
  try{
    const d=await getInfo(u);
    $("rt").textContent=d.title;$("rm").textContent=d.meta;
    $("thumb").style.background=d.thumb?"url('"+d.thumb+"') center/cover":"";
    sel=0;Q=d.qualities;
    $("q").innerHTML=d.qualities.map((q,i)=>`<button data-i="${i}" class="${i?"":"sel"}">${q[0]}<small>${q[1]}</small></button>`).join("");
    $("q").querySelectorAll("button").forEach(x=>x.onclick=()=>{
      sel=+x.dataset.i;$("q").querySelectorAll("button").forEach(y=>y.classList.toggle("sel",y===x))
    });
    b.style.display="none";$("res").classList.add("on");$("prog").classList.remove("on");mountAd($("adResult"));
  }catch(e){$("err").textContent=e instanceof TypeError?"Server se connect nahi ho paya. 1 minute baad dobara try karo.":(e.message||"Kuch gadbad hui. Dobara try karo.")}
  b.disabled=false;
};
$("fetchBtn").onclick=check;
let dt;$("url").addEventListener("input",()=>{clearTimeout(dt);$("res").classList.remove("on");$("fetchBtn").style.display="";dt=setTimeout(()=>{const u=$("url").value.trim();if(u&&valid(u))check()},400)});

/* Download -> interstitial ad (user ke apne tap par) -> download */
let tm;
$("dl").onclick=()=>{
  if(busy)return;
  try{window.open(SMARTLINK,"_blank")}catch(e){}
  $("ov").classList.add("on");mountAd($("adInter"));
  let s=AD_SECONDS;$("cd").textContent=s;$("skip").disabled=true;$("skip").textContent="Download shuru karo";
  clearInterval(tm);
  tm=setInterval(()=>{s--;$("cd").textContent=Math.max(s,0);if(s<=0){clearInterval(tm);$("ov").classList.remove("on");startDownload()}},1000);
};
$("skip").onclick=()=>{$("ov").classList.remove("on");startDownload()};

async function realDownload(){
  let mu="";
  busy=true;$("prog").classList.add("on");$("dl").disabled=true;$("dl").textContent="Download ho raha hai…";
  $("pl").textContent="Server file taiyaar kar raha hai…";$("pp").textContent="";$("bar").style.width="8%";
  try{
    mu=API_BASE+"/download?url="+encodeURIComponent($("url").value.trim())+"&kind="+T[cur].kind+"&q="+Q[sel][2];
    const r=await fetch(mu);
    if(!r.ok){let m="Download fail hua";try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}
    const total=+r.headers.get("Content-Length")||0,rd=r.body.getReader(),ch=[];let got=0;
    $("pl").textContent="Download ho raha hai…";
    for(;;){const x=await rd.read();if(x.done)break;ch.push(x.value);got+=x.value.length;
      if(total){const p=got/total*100;$("bar").style.width=p+"%";$("pp").textContent=Math.floor(p)+"%"}else{$("pp").textContent=(got/1048576).toFixed(1)+" MB"}}
    const cd=r.headers.get("Content-Disposition")||"";const m=/filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(cd);
    const name=m?decodeURIComponent(m[1]):(($("rt").textContent||"grabnest").replace(/[\\/:*?"<>|]/g,"").slice(0,60)+"."+(Q[sel][3]||"mp4"));
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(ch));a.download=name;document.body.appendChild(a);a.click();a.remove();
    $("bar").style.width="100%";$("pp").textContent="100%";$("pl").textContent="Ho gaya! File save ho gayi.";
  }catch(e){
    if(mu&&e instanceof TypeError){window.open(mu,"_blank");$("bar").style.width="100%";$("pl").textContent="Nayi tab mein khul gaya — wahan long-press karke Save/Download karo.";$("pp").textContent=""}
    else{$("pl").textContent=e.message;$("pp").textContent=""}
  }
  busy=false;$("dl").disabled=false;$("dl").textContent="⬇ Dobara download karo";
}
function startDownload(){
  if(API_BASE)return realDownload();
  busy=true;$("prog").classList.add("on");$("dl").disabled=true;$("dl").textContent="Download ho raha hai…";
  let p=0;$("pl").textContent="Download ho raha hai…";
  /* REAL: window.location = API_BASE+"/download?url="+encodeURIComponent($("url").value)+"&q="+sel; */
  const iv=setInterval(()=>{
    if(!busy){clearInterval(iv);return}
    p=Math.min(100,p+Math.random()*9+3);
    $("bar").style.width=p+"%";$("pp").textContent=Math.floor(p)+"%";
    if(p>=100){clearInterval(iv);busy=false;$("pl").textContent="Ho gaya! (demo)";$("dl").disabled=false;$("dl").textContent="⬇ Dobara download karo"}
  },250);
}

/* ===== ADS (Adsterra-style) ===== */
const SMARTLINK="https://araplhn.org/4/44f64e9a9df24b80104dfd7b51b3b0b5";
function fitAd(el){
  const f=el.firstElementChild;if(!f||f.tagName!=="IFRAME")return;
  const w=+el.dataset.w,h=+el.dataset.h,s=Math.min(1,el.clientWidth/w);
  f.style.transform="scale("+s+")";f.style.left=Math.max(0,(el.clientWidth-w*s)/2)+"px";
  el.style.height=Math.ceil(h*s)+"px";
}
function mountAd(el){
  if(!el||el.dataset.done)return;el.dataset.done=1;
  const w=+el.dataset.w,h=+el.dataset.h,k=el.dataset.key,f=document.createElement("iframe");
  f.width=w;f.height=h;f.scrolling="no";f.setAttribute("frameborder","0");
  f.style.cssText="border:0;position:absolute;top:0;left:0;transform-origin:0 0";
  f.srcdoc='<!doctype html><html><body style="margin:0;background:transparent"><script>atOptions={"key":"'+k+'","format":"iframe","height":'+h+',"width":'+w+',"params":{}};<\/script><script src="https://bauval.org/22/'+k+'"><\/script></body></html>';
  el.appendChild(f);fitAd(el);
}
window.addEventListener("load",()=>{
  ["adTop","adHome","adSticky"].forEach(id=>mountAd($(id)));
  if(innerWidth>=1100){mountAd($("adRailL"));mountAd($("adRailR"))}
});
window.addEventListener("resize",()=>document.querySelectorAll(".adbox[data-done]").forEach(fitAd));
